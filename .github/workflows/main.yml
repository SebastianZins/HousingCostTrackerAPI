name: Run Tests

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Run .NET Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore HousingCostTrackerAPI/HousingCostTrackerAPI.slnx

      - name: Build solution
        run: dotnet build HousingCostTrackerAPI/HousingCostTrackerAPI.slnx --no-restore --configuration Release

      - name: Run all tests
        run: dotnet test HousingCostTrackerAPI/HousingCostTrackerAPI.slnx --no-build --no-restore --configuration Release
